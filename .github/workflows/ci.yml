name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  generated-in-sync:
    name: generated files in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: scripts/build-policies.sh --check
      - run: node scripts/build-models-seed.mjs --check

  db:
    name: migrations + RLS check + smoke
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env: { POSTGRES_PASSWORD: postgres }
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
      - run: scripts/db-test.sh
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres

  web:
    name: web lint + typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: probe
        run: echo "present=$([ -f apps/web/package.json ] && echo 1 || echo 0)" >> "$GITHUB_OUTPUT"
      - if: steps.probe.outputs.present == '1'
        uses: pnpm/action-setup@v4
      - if: steps.probe.outputs.present == '1'
        uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - if: steps.probe.outputs.present == '1'
        run: pnpm install --frozen-lockfile && pnpm --filter web lint && pnpm --filter web typecheck
      - if: steps.probe.outputs.present == '0'
        run: echo "apps/web not scaffolded yet (P1-03) — skipping"

  orchestrator:
    name: orchestrator lint + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: probe
        run: echo "present=$([ -f services/orchestrator/pyproject.toml ] && echo 1 || echo 0)" >> "$GITHUB_OUTPUT"
      - if: steps.probe.outputs.present == '1'
        uses: astral-sh/setup-uv@v5
      - if: steps.probe.outputs.present == '1'
        working-directory: services/orchestrator
        run: uv sync && uv run ruff check . && uv run pytest -q
      - if: steps.probe.outputs.present == '0'
        run: echo "services/orchestrator not scaffolded yet (P1-10) — skipping"

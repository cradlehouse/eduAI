name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  generated-in-sync:
    name: generated files in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: scripts/build-policies.sh --check
      - run: node scripts/build-models-seed.mjs --check

  db:
    name: migrations + RLS check + smoke
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env: { POSTGRES_PASSWORD: postgres }
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      # ubuntu-24.04 runners ship psql; only fall back to apt if it's missing (apt update flakes on
      # third-party repos in the image, so never run it unconditionally).
      - run: command -v psql >/dev/null || (sudo apt-get update -qq -o Acquire::Retries=3 && sudo apt-get install -y -qq postgresql-client)
      - run: scripts/db-test.sh
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres

  web:
    name: web lint + typecheck + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4   # version comes from package.json packageManager
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter web lint
      - run: pnpm --filter web typecheck
      # Builds against the committed public keys in apps/web/.env.production. No deploy from CI:
      # deploys are explicit (`pnpm --filter web cf:deploy`) so a push is never a deploy.
      - run: pnpm --filter web build

  orchestrator:
    name: orchestrator lint + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: probe
        run: echo "present=$([ -f services/orchestrator/pyproject.toml ] && echo 1 || echo 0)" >> "$GITHUB_OUTPUT"
      - if: steps.probe.outputs.present == '1'
        uses: astral-sh/setup-uv@v5
      - if: steps.probe.outputs.present == '1'
        working-directory: services/orchestrator
        run: uv sync && uv run ruff check . && uv run pytest -q
      - if: steps.probe.outputs.present == '0'
        run: echo "services/orchestrator not scaffolded yet (P1-10) — skipping"

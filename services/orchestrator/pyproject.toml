[project]
name = "orchestrator"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.35",
    "fastapi>=0.115",
    "httpx>=0.27",
    "jsonschema>=4.23",
    "psycopg[binary,pool]>=3.2",
    "pydantic-settings>=2.5",
    "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 180
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
markers = ["integration: needs ORCH_TEST_DATABASE_URL (throwaway Postgres with migrations + seeds)"]

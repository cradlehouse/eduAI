# Supabase CLI config. Migrations live here in supabase/migrations (native layout, same as ercotcron);
# packages/db/migrations is a symlink kept for the handoffs layout.
project_id = "eduai"

[api]
enabled = true
port = 54321
# `eduai` (internal helpers, claim/settle) is deliberately NOT exposed here.
schemas = ["public", "graphql_public"]
extra_search_path = ["public"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.seed]
enabled = true
# Order matters: the demo org's model allowlist selects from models.
sql_paths = ["../packages/db/seed/models.sql", "../packages/db/seed/seed.sql"]

[studio]
enabled = true
port = 54323

[local_smtp]
enabled = true
port = 54324

[realtime]
enabled = true

[auth]
enabled = true
site_url = "https://eduai-web.long-night-f7d0.workers.dev"
additional_redirect_urls = ["https://eduai-web.long-night-f7d0.workers.dev/**", "http://localhost:3000/**"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

# Links carry token_hash straight to our /auth/callback (verifyOtp), not Supabase's PKCE ?code=
# redirect: a link opened in a different browser than the one that requested it still works.
# The link starts from {{ .SiteURL }}; the original emailRedirectTo travels as redirect_to and the
# callback lifts ?next= out of it (same-origin only).
[auth.email.template.magic_link]
subject = "Sign in to Imaje"
content_path = "./supabase/templates/magic_link.html"

[auth.email.template.confirmation]
subject = "Confirm your email for Imaje"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.recovery]
subject = "Reset your Imaje password"
content_path = "./supabase/templates/recovery.html"

# Google sign-in: create an OAuth client (Web) in Google Cloud with redirect URI
# https://zhltmlguysknjeueabyy.supabase.co/auth/v1/callback, then either set these two env vars and
# `supabase config push`, or paste them in Dashboard → Auth → Providers → Google. Then flip
# NEXT_PUBLIC_AUTH_GOOGLE to "1" in apps/web/wrangler.jsonc + .env.production and redeploy the web app.
# [auth.external.google]
# enabled = true
# client_id = "env(GOOGLE_CLIENT_ID)"
# secret = "env(GOOGLE_CLIENT_SECRET)"

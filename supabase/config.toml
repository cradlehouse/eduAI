# Supabase CLI config. Migrations live here in supabase/migrations (native layout, same as ercotcron);
# packages/db/migrations is a symlink kept for the handoffs layout.
project_id = "eduai"

[api]
enabled = true
port = 54321
# `eduai` (internal helpers, claim/settle) is deliberately NOT exposed here.
schemas = ["public", "graphql_public"]
extra_search_path = ["public"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.seed]
enabled = true
# Order matters: the demo org's model allowlist selects from models.
sql_paths = ["../packages/db/seed/models.sql", "../packages/db/seed/seed.sql"]

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[realtime]
enabled = true

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

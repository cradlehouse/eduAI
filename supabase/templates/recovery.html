<h2>Reset your Imaje password</h2>
<p>Click the link below, then choose a new password. The link expires in an hour.</p>
<p><a href="{{ .SiteURL }}/auth/callback?token_hash={{ .TokenHash }}&type=recovery&redirect_to={{ .RedirectTo }}">Choose a new password</a></p>
<p style="color:#666;font-size:12px">If you didn't ask for this, ignore this email. Your password stays as it is.</p>
